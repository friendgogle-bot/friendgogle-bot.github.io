name: Publish Yuanche Official Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yuanche-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public-only website
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f books/cut-to-one.html
          test -f books/bian-le-you-mei-bian.html
          test -f assets/covers/cut-to-one.webp
          test ! -e internal
          test ! -e QA-manifest.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTTPS pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://friendgogle-bot.github.io'
          for route in / /books.html /books/cut-to-one.html /books/bian-le-you-mei-bian.html /reading.html /about.html /contact.html /sitemap.xml /assets/covers/cut-to-one.webp; do
            echo "Checking ${base}${route}"
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 25 "${base}${route}" -o /tmp/yuanche-check
            test -s /tmp/yuanche-check
          done
          curl --fail --silent --show-error --location "${base}/" -o /tmp/yuanche-home.html
          grep -q '切到一' /tmp/yuanche-home.html
          grep -q '探索作品' /tmp/yuanche-home.html
          curl --fail --silent --show-error --location "${base}/contact.html" -o /tmp/yuanche-contact.html
          grep -q 'yuanche.workflow@gmail.com' /tmp/yuanche-contact.html
          echo 'PUBLIC_SITE_HTTPS_SMOKE=PASS'
