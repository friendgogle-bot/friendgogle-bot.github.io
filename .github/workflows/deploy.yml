name: Publish Yuanche Official Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yuanche-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public content
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/content/about-author.webp
          test -f assets/content/di-ceng-si-kao.webp
          for img in mei-you-feng wu-wei zi-yan yi-yi xun-huan wu-dong-de-sheng-ming; do test -f "assets/content/${img}.webp"; done
          test -f content.css
          for page in index.html reading.html about.html reading/di-ceng-si-kao.html reading/mei-you-feng.html reading/wu-wei.html reading/zi-yan.html reading/yi-yi.html reading/xun-huan.html; do
            grep -qi '<title' "$page"
            grep -q 'canonical' "$page"
            grep -q 'og:image' "$page"
          done
          grep -q '藍紫焰（過去筆名）' reading/di-ceng-si-kao.html
          grep -q '隨時選擇當下最佳' index.html
          grep -q 'di-ceng-si-kao.html' sitemap.xml
          echo 'PUBLIC_CONTENT_STATIC=PASS'
      - name: Build public-only release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/books _site/reading
          cp -R assets/. _site/assets/
          cp -R books/. _site/books/
          cp -R reading/. _site/reading/
          cp index.html books.html reading.html releases.html about.html contact.html contact-activation-test-20260925.html contact-formspree-test-20260925.html search.html 404.html style.css content.css search.js site-search.js contact.js robots.txt sitemap.xml favicon.svg _site/
          touch _site/.nojekyll
          test ! -e _site/.github
          test ! -e _site/internal
          echo 'PUBLIC_ONLY_ARTIFACT=PASS'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base='https://friendgogle-bot.github.io'
          for route in / /reading.html /about.html /reading/di-ceng-si-kao.html /reading/mei-you-feng.html /reading/wu-wei.html /reading/zi-yan.html /reading/yi-yi.html /reading/xun-huan.html /assets/content/about-author.webp /assets/content/di-ceng-si-kao.webp /assets/content/mei-you-feng.webp /assets/content/wu-wei.webp /assets/content/zi-yan.webp /assets/content/yi-yi.webp /assets/content/xun-huan.webp /assets/content/wu-dong-de-sheng-ming.webp /content.css /sitemap.xml /404.html; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 25 "${base}${route}" -o /tmp/yuanche-check
            test -s /tmp/yuanche-check
          done
          curl --fail --silent --show-error --location "${base}/reading.html" -o /tmp/reading.html
          grep -q '底層思考' /tmp/reading.html
          grep -q '沒有風' /tmp/reading.html
          curl --fail --silent --show-error --location "${base}/about.html" -o /tmp/about.html
          grep -q '看見。分開。歸位。' /tmp/about.html
          code="$(curl --silent --show-error --location -o /tmp/not-found -w '%{http_code}' "${base}/__yuanche_content_missing_20261015")"
          test "$code" = '404'
          echo 'PUBLIC_SITE_HTTPS_SMOKE=PASS'