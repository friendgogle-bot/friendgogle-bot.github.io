name: Publish Yuanche Official Site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: yuanche-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public content, image binaries and two-book state
        shell: bash
        run: |
          set -euo pipefail
          test ! -e internal
          test ! -e QA-manifest.json
          for f in assets/covers/zi-zhu-cheng-zhang-card.webp assets/covers/sui-shi-xuan-ze-dang-xia-zui-jia-card.webp assets/og/home.png; do test -s "$f"; done
          test "$(file -b --mime-type assets/covers/zi-zhu-cheng-zhang-card.webp)" = "image/webp"
          test "$(file -b --mime-type assets/covers/sui-shi-xuan-ze-dang-xia-zui-jia-card.webp)" = "image/webp"
          test -f content.css
          test -f contact.js
          test -f site-search.js
          test -f robots.txt
          test -f sitemap.xml
          grep -q '/books/zi-zhu-cheng-zhang.html' sitemap.xml
          grep -q '/books/sui-shi-xuan-ze-dang-xia-zui-jia.html' sitemap.xml
          if grep -q '/books/cut-to-one.html' sitemap.xml; then exit 1; fi
          if grep -q '/books/bian-le-you-mei-bian.html' sitemap.xml; then exit 1; fi
          test "$(grep -o 'class=\"book-card card\"' books.html | wc -l)" -eq 2
          grep -q '目前顯示 2 本' books.html
          grep -q '自主成長' books.html
          grep -q '隨時選擇當下最佳' books.html
          if grep -q '切到一' books.html; then exit 1; fi
          if grep -q '變了又沒變' books.html; then exit 1; fi
          grep -q '目前只列兩本書' releases.html
          if grep -q '切到一' releases.html; then exit 1; fi
          if grep -q '變了又沒變' releases.html; then exit 1; fi
          if grep -q 'about-author.webp' about.html; then exit 1; fi
          grep -q '看見。分開。歸位。' about.html
          grep -q 'book-slider' index.html
          grep -q '>出版<' index.html
          grep -q '>待出版<' index.html
          grep -q '讓下一個能力，從真實結果中長出來' books/zi-zhu-cheng-zhang.html
          grep -q '>待出版<' books/sui-shi-xuan-ze-dang-xia-zui-jia.html
          grep -q '本來如是' reading/di-ceng-si-kao.html
          grep -q '無法停止的生命之海' reading/wu-dong-de-sheng-ming.html
          grep -q 'noindex,nofollow,noarchive' contact-activation-test-20260925.html
          grep -q 'https://formsubmit.co/yuanche.workflow@gmail.com' contact-activation-test-20260925.html
          grep -q 'noindex,nofollow,noarchive' contact-formspree-test-20260925.html
          grep -q 'https://formspree.io/f/xwlpqwog' contact-formspree-test-20260925.html
          grep -q 'name="consent"' contact-formspree-test-20260925.html
          grep -q 'noindex' search.html
          grep -q 'noindex' 404.html
          echo 'STATIC_AND_IMAGE_QA=PASS'
      - name: Build explicit public-only release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/books _site/reading
          cp -R assets/. _site/assets/
          cp -R books/. _site/books/
          cp -R reading/. _site/reading/
          cp index.html books.html reading.html releases.html about.html contact.html contact-activation-test-20260925.html contact-formspree-test-20260925.html search.html 404.html style.css content.css search.js site-search.js contact.js robots.txt sitemap.xml favicon.svg _site/
          touch _site/.nojekyll
          test ! -e _site/.github
          test ! -e _site/internal
          test ! -e _site/README.md
          test ! -e _site/QA-manifest.json
          echo 'PUBLIC_ONLY_ARTIFACT=PASS'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site and actual image decoding
        shell: bash
        run: |
          set -euo pipefail
          base='https://friendgogle-bot.github.io'
          for route in / /books.html /books/zi-zhu-cheng-zhang.html /books/sui-shi-xuan-ze-dang-xia-zui-jia.html /reading.html /reading/di-ceng-si-kao.html /reading/wu-dong-de-sheng-ming.html /releases.html /about.html /contact.html /search.html /sitemap.xml /robots.txt /style.css /content.css /site-search.js /contact.js /assets/covers/zi-zhu-cheng-zhang-card.webp /assets/covers/sui-shi-xuan-ze-dang-xia-zui-jia-card.webp /assets/og/home.png /404.html; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 25 "${base}${route}" -o /tmp/yuanche-check
            test -s /tmp/yuanche-check
          done
          curl --fail --silent --show-error --location "${base}/assets/covers/zi-zhu-cheng-zhang-card.webp" -o /tmp/autonomous-growth-cover.webp
          test "$(file -b --mime-type /tmp/autonomous-growth-cover.webp)" = "image/webp"
          curl --fail --silent --show-error --location "${base}/books.html" -o /tmp/books.html
          grep -q '目前顯示 2 本' /tmp/books.html
          test "$(grep -o 'class=\"book-card card\"' /tmp/books.html | wc -l)" -eq 2
          if grep -q '切到一' /tmp/books.html; then exit 1; fi
          if grep -q '變了又沒變' /tmp/books.html; then exit 1; fi
          curl --fail --silent --show-error --location "${base}/about.html" -o /tmp/about.html
          if grep -q 'about-author.webp' /tmp/about.html; then exit 1; fi
          grep -q '看見。分開。歸位。' /tmp/about.html
          curl --fail --silent --show-error --location "${base}/" -o /tmp/home.html
          grep -q '自主成長' /tmp/home.html
          grep -q '隨時選擇當下最佳' /tmp/home.html
          grep -q '>出版<' /tmp/home.html
          grep -q '>待出版<' /tmp/home.html
          curl --fail --silent --show-error --location "${base}/reading/di-ceng-si-kao.html" -o /tmp/bottom-thinking.html
          grep -q '本來如是' /tmp/bottom-thinking.html
          curl --fail --silent --show-error --location "${base}/contact.html" -o /tmp/contact.html
          grep -q 'yuanche.workflow@gmail.com' /tmp/contact.html
          code="$(curl --silent --show-error --location -o /tmp/not-found -w '%{http_code}' "${base}/__yuanche_missing_image_fix_20261015")"
          test "$code" = '404'
          grep -q '這個頁面暫時找不到' /tmp/not-found
          echo 'LIVE_IMAGE_AND_SITE_QA=PASS'