春去冬來夏秋跟
生老病死復塵土
成住壞空皆現象
存於一時觀恆久
新芽長出舊葉落
復此循環恆長久
念念一出復成舊
無有一物可留存
唯有處之化為恆</div><p class="note">歷史作品保留原始文字與署名脈絡；本站不以後來的解釋改寫原詩。</p><p><a class="btn secondary" href="/reading.html">返回免費閱讀 →</a></p></article></div></section></main></body></html>
