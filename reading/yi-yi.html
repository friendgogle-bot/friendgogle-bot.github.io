誰人說文說成章
故事本身無意義
人人觀之解不同
生命本身無意義
怎麼活著怎麼樂
世間本身無意義
存於一時想虛幻
若要求真化為意
先需一刻享清幽</div><p class="note">歷史作品保留原始文字與署名脈絡；本站不以後來的解釋改寫原詩。</p><p><a class="btn secondary" href="/reading.html">返回免費閱讀 →</a></p></article></div></section></main></body></html>
